version: "3"

# Linters run from uv's tool cache at these versions, never from .venv. Bump them here.
vars:
  RUFF: uvx ruff@0.17.3
  TY: uvx ty@0.0.94

tasks:
  default:
    cmds:
      - task --list
    silent: true

  setup:
    desc: Install .venv from uv.lock
    cmds:
      - uv sync

  sync:
    desc: Sync main.py and main.ipynb; the one saved last wins
    cmds:
      - uv run jupytext --sync main.py

  nb:
    desc: Open main.ipynb in Jupyter Lab
    cmds:
      - task: sync
      - uv run jupyter lab main.ipynb

  fmt:
    desc: Fix lint and format with ruff
    cmds:
      - "{{.RUFF}} check --fix ."
      - "{{.RUFF}} format ."

  lock-check:
    desc: Fail if uv.lock is out of date with pyproject.toml
    cmds:
      - uv lock --check

  fmt-check:
    desc: Fail on unformatted code
    cmds:
      - "{{.RUFF}} format --check ."

  lint:
    desc: Ruff lint, no fixes
    cmds:
      - "{{.RUFF}} check ."

  typecheck:
    desc: Type check with ty against .venv, synced first
    cmds:
      - uv sync --locked
      - "{{.TY}} check"

  ci:
    desc: Every check, in order; CI runs this
    cmds:
      - task: lock-check
      - task: fmt-check
      - task: lint
      - task: typecheck
