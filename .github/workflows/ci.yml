name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      # Dev group only. The runtime deps pull torch and ~3 GB of CUDA wheels on Linux,
      # and nothing in `task lint` imports them.
      - run: uv sync --locked --only-dev

      - run: task lint
        env:
          UV_NO_SYNC: "1" # keep `uv run` from syncing the runtime deps back in
