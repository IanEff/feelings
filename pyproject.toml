[project]
name = "feelings"
version = "0.1.0"
description = "A vector rendering of tenderness"
readme = "README.md"
authors = [{ name = "Ian Furst", email = "ian.furst@gmail.com" }]
requires-python = ">=3.15"
dependencies = [
    "en-core-web-sm",
    "kaleido>=1.5.0",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
    # Direct so [tool.uv.sources] can route it; sentence-transformers is what needs it.
    "spacy>=3.8.18",
    "torch>=2.15.0",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.6",
    "jupytext>=1.19.6",
]

[tool.uv]
package = false
required-version = "==0.13.5"  # setup-uv reads this, so CI runs the same uv

# Linux gets CPU-only torch: PyPI's Linux wheel pulls ~3 GB of CUDA that CI never uses.
# macOS keeps PyPI's wheel, which is CPU/MPS already.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
extend-exclude = ["*.ipynb"]  # main.ipynb is generated; lint main.py

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "RUF", "SIM"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["B018"]  # a bare `fig` at the end of a cell is how Jupyter displays it
