[project]
name = "feelings"
version = "0.1.0"
description = "A vector rendering of tenderness"
readme = "README.md"
authors = [{ name = "Ian Furst", email = "ian.furst@gmail.com" }]
requires-python = ">=3.15"
dependencies = [
    "pandas>=3.1.1",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.6",
    "jupytext>=1.19.6",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
extend-exclude = ["*.ipynb"]  # main.ipynb is generated; lint main.py

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "RUF", "SIM"]
