services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: feelings-app
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    restart: unless-stopped
